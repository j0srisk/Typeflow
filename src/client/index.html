<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeFlow Development Server</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <nav>
          <h1>TypeFlow Development Server</h1>
        </nav>

        <main>
          <section class="section">
            <h2 class="section-title">Scripts</h2>
            <div class="section-content">
              <p class="section-description">
                Copy and paste the code below into your webflow site to run the
                scripts.
              </p>
              <ul class="section-list" id="js-files">
                <!-- JS files will be populated here -->
              </ul>
            </div>
          </section>
          <section class="section">
            <h2 class="section-title">Stylesheets</h2>
            <div class="section-content">
              <p class="section-description">
                Copy and paste the code below into your webflow site to run the
                scripts.
              </p>
              <ul class="section-list" id="css-files">
                <!-- CSS files will be populated here -->
              </ul>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="/main.js"></script>
  </body>
</html>
